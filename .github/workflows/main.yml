name: Build APK

# Runs on every push to main, and can also be triggered manually from
# the Actions tab (the "Run workflow" button).
#
# Expects this repo's root to directly contain src/, package.json,
# index.js, app.json, babel.config.js, metro.config.js, tsconfig.json
# (uploaded as loose files/folders, not zipped), plus this workflow
# file. It generates the native android/ project with the React
# Native CLI, merges dependencies, patches Android permissions/SDK
# versions, and builds a release APK — all on GitHub's servers. Nothing
# needs to be installed on your machine.
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  RN_VERSION: 0.87.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify expected project files are present
        run: |
          MISSING=""
          for f in src package.json index.js babel.config.js metro.config.js tsconfig.json; do
            if [ ! -e "$f" ]; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing expected file(s)/folder(s) at repo root:$MISSING"
            echo "Make sure these were uploaded directly to the repo root (not inside a subfolder)."
            exit 1
          fi
          echo "All expected files found at repo root:"
          ls

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate native project shell
        run: |
          npx --yes @react-native-community/cli@latest init OfflineTranslatorShell \
            --version "$RN_VERSION" \
            --directory app-shell \
            --package-name com.offlinetranslator.app \
            --skip-install \
            --skip-git-init

      - name: Copy app source into the shell
        run: |
          cp -r src app-shell/
          cp index.js babel.config.js metro.config.js tsconfig.json app-shell/
          # Deliberately NOT copying app.json: react-native init bakes
          # the project name ("OfflineTranslatorShell") into the native
          # Android code as the JS component name it expects. index.js
          # reads that same name from app.json at runtime, so leaving
          # the shell's own generated app.json in place keeps native
          # and JS pointing at the same name. Overwriting it with a
          # different app.json here is exactly what caused "X has not
          # been registered" at launch.

      - name: Merge package.json dependencies
        run: |
          cat > /tmp/merge-pkg.js << 'JSEOF'
          const fs = require('fs');
          const [, , srcPath, destPath] = process.argv;
          const src = JSON.parse(fs.readFileSync(srcPath, 'utf8'));
          const dest = JSON.parse(fs.readFileSync(destPath, 'utf8'));
          dest.dependencies = { ...src.dependencies, ...dest.dependencies };
          dest.devDependencies = { ...(src.devDependencies || {}), ...dest.devDependencies };
          fs.writeFileSync(destPath, JSON.stringify(dest, null, 2) + '\n');
          console.log('Merged dependencies into', destPath);
          JSEOF
          node /tmp/merge-pkg.js package.json app-shell/package.json

      - name: Patch AndroidManifest.xml and build.gradle
        run: |
          cat > /tmp/patch-android.js << 'JSEOF'
          const fs = require('fs');
          const path = require('path');
          const shellDir = process.argv[2];
          const manifestPath = path.join(shellDir, 'android/app/src/main/AndroidManifest.xml');
          const gradlePath = path.join(shellDir, 'android/build.gradle');

          let manifest = fs.readFileSync(manifestPath, 'utf8');
          const permissionLines = {
            'android.permission.INTERNET':
              '    <uses-permission android:name="android.permission.INTERNET" />',
            'android.permission.RECORD_AUDIO':
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
          };
          const missing = Object.keys(permissionLines).filter(name => !manifest.includes(name));
          if (missing.length > 0) {
            const linesToAdd = missing.map(name => permissionLines[name]).join('\n') + '\n';
            const idx = manifest.indexOf('<application');
            if (idx !== -1) {
              manifest = manifest.slice(0, idx) + linesToAdd + '\n' + manifest.slice(idx);
              fs.writeFileSync(manifestPath, manifest);
              console.log('Added permissions:', missing.join(', '));
            } else {
              console.warn('Could not find <application> tag — add these manually:', missing);
            }
          } else {
            console.log('All required permissions already present.');
          }

          let gradle = fs.readFileSync(gradlePath, 'utf8');
          const bump = (name, min) => {
            const re = new RegExp(`(${name}\\s*=\\s*)(\\d+)`);
            gradle = gradle.replace(re, (full, prefix, val) =>
              parseInt(val, 10) < min ? `${prefix}${min}` : full,
            );
          };
          bump('minSdkVersion', 24);
          bump('compileSdkVersion', 34);
          bump('targetSdkVersion', 34);
          fs.writeFileSync(gradlePath, gradle);
          console.log('Checked SDK versions in build.gradle');

          // Release builds default to minification (R8/ProGuard) on,
          // which frequently strips or renames classes that RN native
          // modules reach via reflection — the app installs but
          // crashes immediately on launch, with no build-time error to
          // point at. Disabling it trades a larger APK for a release
          // build that behaves like debug at the JS/native boundary,
          // which is the right trade for a sideloaded personal build.
          const appGradlePath = path.join(shellDir, 'android/app/build.gradle');
          let appGradle = fs.readFileSync(appGradlePath, 'utf8');
          appGradle = appGradle.replace(/minifyEnabled\s+.*/g, 'minifyEnabled false');
          appGradle = appGradle.replace(/shrinkResources\s+.*/g, 'shrinkResources false');
          fs.writeFileSync(appGradlePath, appGradle);
          console.log('Disabled release minification in app/build.gradle');

          // Capture native crashes to a file the app can display on its
          // own Settings screen, since a native-level crash (as opposed
          // to a JS exception) never reaches React Native's own error
          // handling and normally needs adb/USB debugging to see at all.
          function findFile(dir, name) {
            let entries;
            try {
              entries = fs.readdirSync(dir, { withFileTypes: true });
            } catch (e) {
              return null;
            }
            for (const entry of entries) {
              if (entry.isSymbolicLink()) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                const found = findFile(full, name);
                if (found) return found;
              } else if (entry.name === name) {
                return full;
              }
            }
            return null;
          }

          const mainAppPath = findFile(path.join(shellDir, 'android/app/src/main/java'), 'MainApplication.kt');
          if (!mainAppPath) {
            console.warn('Could not find MainApplication.kt — skipping crash log capture.');
          } else {
            let mainApp = fs.readFileSync(mainAppPath, 'utf8');
            const marker = 'super.onCreate()';
            if (mainApp.includes(marker) && !mainApp.includes('setDefaultUncaughtExceptionHandler')) {
              const handlerCode = [
                '    val defaultHandler = Thread.getDefaultUncaughtExceptionHandler()',
                '    Thread.setDefaultUncaughtExceptionHandler { thread, throwable ->',
                '      try {',
                '        val sw = java.io.StringWriter()',
                '        throwable.printStackTrace(java.io.PrintWriter(sw))',
                '        java.io.File(filesDir, "last_crash.txt").writeText(sw.toString())',
                '      } catch (e: Exception) {',
                '      }',
                '      defaultHandler?.uncaughtException(thread, throwable)',
                '    }',
                '',
              ].join('\n');
              mainApp = mainApp.replace(marker, marker + '\n' + handlerCode);
              fs.writeFileSync(mainAppPath, mainApp);
              console.log('Added crash log capture to', mainAppPath);
            } else {
              console.warn('Could not find insertion point in MainApplication.kt — skipping.');
            }
          }
          JSEOF
          node /tmp/patch-android.js app-shell

      - name: Add custom native audio recorder (Android AudioRecord)
        run: |
          cat > /tmp/add-audio-module.js << 'JSEOF'
          const fs = require('fs');
          const path = require('path');
          const shellDir = process.argv[2];

          function findFile(dir, name) {
            let entries;
            try {
              entries = fs.readdirSync(dir, { withFileTypes: true });
            } catch (e) {
              return null;
            }
            for (const entry of entries) {
              if (entry.isSymbolicLink()) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                const found = findFile(full, name);
                if (found) return found;
              } else if (entry.name === name) {
                return full;
              }
            }
            return null;
          }

          const mainAppPath = findFile(path.join(shellDir, 'android/app/src/main/java'), 'MainApplication.kt');
          if (!mainAppPath) {
            console.warn('Could not find MainApplication.kt — skipping custom audio module.');
            process.exit(0);
          }

          const androidPackageDir = path.dirname(mainAppPath);

          const moduleContent = [
              "package com.offlinetranslator.app",
              "",
              "import android.Manifest",
              "import android.content.pm.PackageManager",
              "import android.media.AudioFormat",
              "import android.media.AudioRecord",
              "import android.media.MediaRecorder",
              "import com.facebook.react.bridge.Promise",
              "import com.facebook.react.bridge.ReactApplicationContext",
              "import com.facebook.react.bridge.ReactContextBaseJavaModule",
              "import com.facebook.react.bridge.ReactMethod",
              "import java.io.File",
              "import java.io.FileOutputStream",
              "import java.io.RandomAccessFile",
              "import kotlin.concurrent.thread",
              "",
              "class SimpleAudioRecorderModule(reactContext: ReactApplicationContext) :",
              "  ReactContextBaseJavaModule(reactContext) {",
              "",
              "  override fun getName() = \"SimpleAudioRecorder\"",
              "",
              "  private var audioRecord: AudioRecord? = null",
              "  private var recordingThread: Thread? = null",
              "  @Volatile private var isRecording = false",
              "  private var pcmFile: File? = null",
              "",
              "  private val sampleRate = 16000",
              "  private val channelConfig = AudioFormat.CHANNEL_IN_MONO",
              "  private val audioFormat = AudioFormat.ENCODING_PCM_16BIT",
              "",
              "  @ReactMethod",
              "  fun startRecording(promise: Promise) {",
              "    try {",
              "      if (reactApplicationContext.checkSelfPermission(Manifest.permission.RECORD_AUDIO) !=",
              "        PackageManager.PERMISSION_GRANTED",
              "      ) {",
              "        promise.reject(\"PERMISSION_DENIED\", \"Microphone permission not granted\")",
              "        return",
              "      }",
              "",
              "      val minBufferSize = AudioRecord.getMinBufferSize(sampleRate, channelConfig, audioFormat)",
              "      val bufferSize = if (minBufferSize > 0) minBufferSize * 2 else sampleRate * 2",
              "",
              "      val recorder = AudioRecord(",
              "        MediaRecorder.AudioSource.MIC,",
              "        sampleRate,",
              "        channelConfig,",
              "        audioFormat,",
              "        bufferSize,",
              "      )",
              "      audioRecord = recorder",
              "",
              "      val file = File(reactApplicationContext.cacheDir, \"rec-${System.currentTimeMillis()}.pcm\")",
              "      pcmFile = file",
              "      val fos = FileOutputStream(file)",
              "",
              "      recorder.startRecording()",
              "      isRecording = true",
              "",
              "      recordingThread = thread {",
              "        val buffer = ByteArray(bufferSize)",
              "        while (isRecording) {",
              "          val read = recorder.read(buffer, 0, buffer.size)",
              "          if (read > 0) {",
              "            fos.write(buffer, 0, read)",
              "          }",
              "        }",
              "        fos.close()",
              "      }",
              "",
              "      promise.resolve(null)",
              "    } catch (e: Exception) {",
              "      promise.reject(\"START_FAILED\", e.message, e)",
              "    }",
              "  }",
              "",
              "  @ReactMethod",
              "  fun stopRecording(promise: Promise) {",
              "    try {",
              "      isRecording = false",
              "      recordingThread?.join(2000)",
              "      audioRecord?.stop()",
              "      audioRecord?.release()",
              "      audioRecord = null",
              "",
              "      val rawFile = pcmFile",
              "      if (rawFile == null || !rawFile.exists()) {",
              "        promise.reject(\"NO_FILE\", \"No recording found\")",
              "        return",
              "      }",
              "",
              "      val pcmData = rawFile.readBytes()",
              "      val wavFile = File(reactApplicationContext.cacheDir, \"rec-${System.currentTimeMillis()}.wav\")",
              "      writeWavFile(wavFile, pcmData)",
              "      rawFile.delete()",
              "",
              "      promise.resolve(wavFile.absolutePath)",
              "    } catch (e: Exception) {",
              "      promise.reject(\"STOP_FAILED\", e.message, e)",
              "    }",
              "  }",
              "",
              "  private fun writeWavFile(file: File, pcmData: ByteArray) {",
              "    val channels = 1",
              "    val bitsPerSample = 16",
              "    val byteRate = sampleRate * channels * bitsPerSample / 8",
              "    val blockAlign = channels * bitsPerSample / 8",
              "    val dataLength = pcmData.size",
              "",
              "    RandomAccessFile(file, \"rw\").use { raf ->",
              "      raf.writeBytes(\"RIFF\")",
              "      raf.write(intLE(36 + dataLength))",
              "      raf.writeBytes(\"WAVE\")",
              "      raf.writeBytes(\"fmt \")",
              "      raf.write(intLE(16))",
              "      raf.write(shortLE(1))",
              "      raf.write(shortLE(channels))",
              "      raf.write(intLE(sampleRate))",
              "      raf.write(intLE(byteRate))",
              "      raf.write(shortLE(blockAlign))",
              "      raf.write(shortLE(bitsPerSample))",
              "      raf.writeBytes(\"data\")",
              "      raf.write(intLE(dataLength))",
              "      raf.write(pcmData)",
              "    }",
              "  }",
              "",
              "  private fun intLE(value: Int): ByteArray = byteArrayOf(",
              "    (value and 0xff).toByte(),",
              "    ((value shr 8) and 0xff).toByte(),",
              "    ((value shr 16) and 0xff).toByte(),",
              "    ((value shr 24) and 0xff).toByte(),",
              "  )",
              "",
              "  private fun shortLE(value: Int): ByteArray = byteArrayOf(",
              "    (value and 0xff).toByte(),",
              "    ((value shr 8) and 0xff).toByte(),",
              "  )",
              "}",
          ].join('\n') + '\n';
          const packageContent = [
              "package com.offlinetranslator.app",
              "",
              "import com.facebook.react.ReactPackage",
              "import com.facebook.react.bridge.NativeModule",
              "import com.facebook.react.bridge.ReactApplicationContext",
              "import com.facebook.react.uimanager.ViewManager",
              "",
              "class SimpleAudioRecorderPackage : ReactPackage {",
              "  override fun createNativeModules(reactContext: ReactApplicationContext): List<NativeModule> {",
              "    return listOf(SimpleAudioRecorderModule(reactContext))",
              "  }",
              "",
              "  override fun createViewManagers(reactContext: ReactApplicationContext): List<ViewManager<*, *>> {",
              "    return emptyList()",
              "  }",
              "}",
          ].join('\n') + '\n';

          fs.writeFileSync(path.join(androidPackageDir, 'SimpleAudioRecorderModule.kt'), moduleContent);
          fs.writeFileSync(path.join(androidPackageDir, 'SimpleAudioRecorderPackage.kt'), packageContent);
          console.log('Wrote SimpleAudioRecorderModule.kt and SimpleAudioRecorderPackage.kt to', androidPackageDir);

          let mainApp = fs.readFileSync(mainAppPath, 'utf8');
          const pkgMarker = 'PackageList(this).packages';
          if (mainApp.includes(pkgMarker) && !mainApp.includes('SimpleAudioRecorderPackage()')) {
            mainApp = mainApp.replace(pkgMarker, pkgMarker + '.apply { add(SimpleAudioRecorderPackage()) }');
            fs.writeFileSync(mainAppPath, mainApp);
            console.log('Registered SimpleAudioRecorderPackage in', mainAppPath);
          } else {
            console.warn('Could not find package-list marker, or already registered — check manually.');
          }
          JSEOF
          node /tmp/add-audio-module.js app-shell

      - name: Install dependencies
        working-directory: app-shell
        run: npm install

      - name: Patch legacy jcenter() repositories in dependencies
        working-directory: app-shell
        run: |
          cat > /tmp/fix-jcenter.js << 'JSEOF'
          const fs = require('fs');
          const path = require('path');

          function walk(dir, found) {
            let entries;
            try {
              entries = fs.readdirSync(dir, { withFileTypes: true });
            } catch (e) {
              return;
            }
            for (const entry of entries) {
              if (entry.isSymbolicLink()) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(full, found);
              } else if (entry.name === 'build.gradle') {
                found.push(full);
              }
            }
          }

          const gradleFiles = [];
          walk('node_modules', gradleFiles);

          let patchedCount = 0;
          for (const file of gradleFiles) {
            const content = fs.readFileSync(file, 'utf8');
            if (content.includes('jcenter()')) {
              fs.writeFileSync(file, content.split('jcenter()').join('mavenCentral()'));
              console.log('Patched jcenter() -> mavenCentral() in', file);
              patchedCount += 1;
            }
          }
          console.log(`Scanned ${gradleFiles.length} build.gradle file(s), patched ${patchedCount}.`);
          JSEOF
          node /tmp/fix-jcenter.js

      - name: Build release APK
        working-directory: app-shell/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-translator-apk
          path: app-shell/android/app/build/outputs/apk/release/app-release.apk
