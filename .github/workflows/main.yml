name: Build debug APK

# Runs on every push to main, and can also be triggered manually from
# the Actions tab (the "Run workflow" button).
#
# Expects a single .zip file (the OfflineTranslator.zip you downloaded,
# uploaded as-is) sitting at the root of this repo, plus this workflow
# file itself. It unzips that project, generates the native android/
# project with the React Native CLI, merges dependencies, patches
# Android permissions/SDK versions, and builds a debug APK — all on
# GitHub's servers. Nothing needs to be installed on your machine.
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  RN_VERSION: 0.87.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate and unzip the uploaded project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No .zip file found at the repo root. Upload OfflineTranslator.zip there (Add file -> Upload files) and re-run."
            exit 1
          fi
          echo "Found $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(find extracted -maxdepth 1 -mindepth 1 -type d | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Couldn't find a project folder inside the zip."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project at $PROJECT_DIR"
          ls "$PROJECT_DIR"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate native project shell
        run: |
          npx --yes @react-native-community/cli@latest init OfflineTranslatorShell \
            --version "$RN_VERSION" \
            --directory app-shell \
            --package-name com.offlinetranslator.app \
            --skip-install \
            --skip-git-init

      - name: Copy app source into the shell
        run: |
          cp -r "$PROJECT_DIR/src" app-shell/
          cp "$PROJECT_DIR/index.js" "$PROJECT_DIR/app.json" "$PROJECT_DIR/babel.config.js" \
             "$PROJECT_DIR/metro.config.js" "$PROJECT_DIR/tsconfig.json" app-shell/

      - name: Merge package.json dependencies
        run: |
          cat > /tmp/merge-pkg.js << 'JSEOF'
          const fs = require('fs');
          const [, , srcPath, destPath] = process.argv;
          const src = JSON.parse(fs.readFileSync(srcPath, 'utf8'));
          const dest = JSON.parse(fs.readFileSync(destPath, 'utf8'));
          dest.dependencies = { ...src.dependencies, ...dest.dependencies };
          dest.devDependencies = { ...(src.devDependencies || {}), ...dest.devDependencies };
          fs.writeFileSync(destPath, JSON.stringify(dest, null, 2) + '\n');
          console.log('Merged dependencies into', destPath);
          JSEOF
          node /tmp/merge-pkg.js "$PROJECT_DIR/package.json" app-shell/package.json

      - name: Patch AndroidManifest.xml and build.gradle
        run: |
          cat > /tmp/patch-android.js << 'JSEOF'
          const fs = require('fs');
          const path = require('path');
          const shellDir = process.argv[2];
          const manifestPath = path.join(shellDir, 'android/app/src/main/AndroidManifest.xml');
          const gradlePath = path.join(shellDir, 'android/build.gradle');

          let manifest = fs.readFileSync(manifestPath, 'utf8');
          const permissionLines = {
            'android.permission.INTERNET':
              '    <uses-permission android:name="android.permission.INTERNET" />',
            'android.permission.RECORD_AUDIO':
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
            'android.permission.READ_MEDIA_VIDEO':
              '    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />',
            'android.permission.READ_EXTERNAL_STORAGE':
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
          };
          const missing = Object.keys(permissionLines).filter(name => !manifest.includes(name));
          if (missing.length > 0) {
            const linesToAdd = missing.map(name => permissionLines[name]).join('\n') + '\n';
            const idx = manifest.indexOf('<application');
            if (idx !== -1) {
              manifest = manifest.slice(0, idx) + linesToAdd + '\n' + manifest.slice(idx);
              fs.writeFileSync(manifestPath, manifest);
              console.log('Added permissions:', missing.join(', '));
            } else {
              console.warn('Could not find <application> tag — add these manually:', missing);
            }
          } else {
            console.log('All required permissions already present.');
          }

          let gradle = fs.readFileSync(gradlePath, 'utf8');
          const bump = (name, min) => {
            const re = new RegExp(`(${name}\\s*=\\s*)(\\d+)`);
            gradle = gradle.replace(re, (full, prefix, val) =>
              parseInt(val, 10) < min ? `${prefix}${min}` : full,
            );
          };
          bump('minSdkVersion', 24);
          bump('compileSdkVersion', 34);
          bump('targetSdkVersion', 34);
          fs.writeFileSync(gradlePath, gradle);
          console.log('Checked SDK versions in build.gradle');
          JSEOF
          node /tmp/patch-android.js app-shell

      - name: Install dependencies
        working-directory: app-shell
        run: npm install

      - name: Build debug APK
        working-directory: app-shell/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-translator-debug-apk
          path: app-shell/android/app/build/outputs/apk/debug/app-debug.apk
